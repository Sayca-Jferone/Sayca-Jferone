<svg xmlns="http://www.w3.org/2000/svg" width="860" height="258" viewBox="0 0 860 258" role="img" aria-label="How I work: No standard limitation I never reject a method because it is unusual: conventional judgement is what hides breakthrough solutions. Contracts first Each unit is specified before it is built, so blocks assemble into a System that scales. Keep what was learned Every hour of reasoning, human or AI, is captured in a reusable form instead of being lost. Self-documenting projects Humans and AI agents share the same written sources of truth."><title>How I work: No standard limitation I never reject a method because it is unusual: conventional judgement is what hides breakthrough solutions. Contracts first Each unit is specified before it is built, so blocks assemble into a System that scales. Keep what was learned Every hour of reasoning, human or AI, is captured in a reusable form instead of being lost. Self-documenting projects Humans and AI agents share the same written sources of truth.</title><style>@font-face{font-family:'SL B612';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,)format('woff2')}@font-face{font-family:'SL B612 Bold';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,)format('woff2')}.sig{font-family:'SL Sig',Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:800;font-style:italic}.b{font-family:'SL B612','Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;font-style:normal}.bb{font-family:'SL B612 Bold','Segoe UI', Helvetica, Arial, sans-serif;font-weight:700;font-style:normal}.m{font-family:'SL Mono','DejaVu Sans Mono', Consolas, monospace;font-weight:400;font-style:normal}.mb{font-family:'SL Mono Bold','DejaVu Sans Mono', Consolas, monospace;font-weight:700;font-style:normal}</style><rect x="20" y="20" width="820" height="218" fill="#0d0d0d" stroke="rgba(205,222,226,0.16)" stroke-width="1"/><path d="M16 30V16H30M844 30V16H830M16 228V242H30M844 228V242H830" fill="none" stroke="rgba(